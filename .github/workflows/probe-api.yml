name: probe-api
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          for i in 1 2 3 4 5; do
            for n in full part one; do
              case $n in full) U="https://api.open-meteo.com/v1/forecast?hourly=wind_speed_10m%2Cwind_direction_10m%2Cwind_gusts_10m%2Ctemperature_2m&daily=weather_code%2Ctemperature_2m_max%2Ctemperature_2m_min%2Cprecipitation_sum%2Cprecipitation_probability_max%2Csunrise%2Csunset&wind_speed_unit=kn&timezone=Pacific%2FAuckland&forecast_days=14&latitude=-37.632,-37.650,-37.570,-37.700,-37.960,-37.405,-37.220,-37.110,-37.000,-37.820,-37.805,-39.050,-39.150,-39.220,-39.460,-38.683,-38.690,-38.650,-38.310,-39.030,-39.070,-39.070&longitude=176.180,176.200,176.090,176.300,177.040,175.940,175.880,175.890,175.860,174.810,174.825,174.100,173.850,173.780,173.860,178.000,178.070,178.130,178.330,177.970,177.860,177.800";; part) U="https://api.open-meteo.com/v1/forecast?hourly=wind_speed_10m%2Cwind_direction_10m%2Cwind_gusts_10m%2Ctemperature_2m&daily=weather_code%2Ctemperature_2m_max%2Ctemperature_2m_min%2Cprecipitation_sum%2Cprecipitation_probability_max%2Csunrise%2Csunset&wind_speed_unit=kn&timezone=Pacific%2FAuckland&forecast_days=14&latitude=-37.632,-37.650,-37.570,-37.700,-37.960,-37.405,-37.220,-37.110&longitude=176.180,176.200,176.090,176.300,177.040,175.940,175.880,175.890";; one) U="https://api.open-meteo.com/v1/forecast?hourly=wind_speed_10m%2Cwind_direction_10m%2Cwind_gusts_10m%2Ctemperature_2m&daily=weather_code%2Ctemperature_2m_max%2Ctemperature_2m_min%2Cprecipitation_sum%2Cprecipitation_probability_max%2Csunrise%2Csunset&wind_speed_unit=kn&timezone=Pacific%2FAuckland&forecast_days=14&latitude=-37.632&longitude=176.180";; esac
              curl -sS -o /dev/null -w "$n HTTP %{http_code} %{time_total}s %{size_download}B\n" --max-time 45 "$U" || echo "$n TIMEOUT"
            done
            sleep 5
          done
