name: Swellmap forecasts

on:
  schedule:
    - cron: "23 */6 * * *"   # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: swellmap
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet cryptography
      - run: python3 .github/scripts/swellmap.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add swellmap.enc.json
          git diff --cached --quiet || (git commit -m "Update Swellmap forecasts" && git pull --rebase && git push)
