name: Harbour readings

# Reads the live wind and wave numbers off the Port of Tauranga harbour conditions picture every three
# minutes and keeps the last 24 hours in harbour.json on the harbour-data branch, where the app loads it.
# GitHub's own schedule is too patchy for every-few-minutes runs, so each run starts about once an hour
# and keeps reading for close to an hour. The branch is rewritten as a single commit each time.

on:
  schedule:
    - cron: "2 0-10,15-23 * * *"   # hourly, about 4am to 11pm New Zealand time
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: harbour-log
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 62
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
      - name: Read the picture every 3 minutes for about an hour
        run: |
          python3 -c "import PIL, numpy" 2>/dev/null || pip install --quiet --break-system-packages pillow numpy || pip install --quiet pillow numpy
          mkdir data && cd data
          REMOTE="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git init -q -b harbour-data
          END=$(( $(date +%s) + 57*60 ))
          LAST=""
          while [ "$(date +%s)" -lt "$END" ]; do
            START=$(date +%s)
            if git fetch -q --depth 1 "$REMOTE" harbour-data 2>/dev/null; then git show FETCH_HEAD:harbour.json > harbour.json 2>/dev/null || rm -f harbour.json; fi
            if curl -sSL --fail --max-time 30 -A "DaysOffshore personal surf app (github.com/${{ github.repository }})" -D headers.txt -o potsum.jpg "https://www.port-tauranga.co.nz/cameras/potsum.jpg"; then
              MOD=$(grep -i '^last-modified:' headers.txt | tail -1 | cut -d' ' -f2- | tr -d '\r')
              if [ -n "$MOD" ] && [ "$MOD" != "$LAST" ]; then
                if python3 ../.github/scripts/harbour-read.py potsum.jpg "$MOD" harbour.json; then
                  LAST="$MOD"
                  git add harbour.json
                  git -c user.name="harbour-log" -c user.email="harbour-log@users.noreply.github.com" commit -q -m "Harbour readings" --allow-empty
                  git push -q -f "$REMOTE" HEAD:harbour-data || echo "push failed, will retry next round"
                  git update-ref -d HEAD 2>/dev/null; git rm -q --cached harbour.json 2>/dev/null || true
                fi
              fi
            else
              echo "could not fetch the picture this round"
            fi
            WAIT=$(( 180 - ($(date +%s) - START) ))
            [ "$WAIT" -gt 0 ] && sleep "$WAIT"
          done
