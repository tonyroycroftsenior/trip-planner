name: Surf alerts

on:
  schedule:
    - cron: "41 17 * * *"   # 6:41am NZDT (5:41am NZST) every day
  workflow_dispatch:
    inputs:
      test:
        description: "Just send a test push notification"
        type: boolean
        default: false

permissions:
  contents: write   # keeps the list of alerts already sent on the alerts-state branch
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check forecast for good runs
        run: node .github/scripts/surf-alerts.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Phone push via the free ntfy app. Set the NTFY_TOPIC secret to your topic name;
          # without it, alerts fall back to GitHub issues (which email you).
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST_PUSH: ${{ inputs.test }}
